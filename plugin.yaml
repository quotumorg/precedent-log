name: precedent-log
version: "0.4.1"
description: >-
  Saves a human's answer to a blocked Kanban question as a ruling for later workers.
  Shows rulings and vetoes in Desktop, where you can review and retire rulings.
author: quotumorg
license: MIT
requires_hermes: ">=0.23.0"
config_schema:
  precedent_log:
    type: dict
    default: {veto: enforce}
    description: "veto: enforce (default) or advisory. Advisory appends candidates without vetoing."
provides_hooks:
  - pre_tool_call
  - kanban_task_blocked
  - pre_verify
  - post_tool_call
  - on_session_end
