name: Matcher miss or false candidate
description: Report candidate selection for a specific block reason.
labels: [matcher]
body:
  - type: markdown
    attributes:
      value: Label the expected result before rereading matcher code. Redact paths and keys that contain secrets or private data.
  - type: textarea
    id: reason
    attributes:
      label: Block reason text
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Ruling question
    validations:
      required: true
  - type: textarea
    id: keys_aliases
    attributes:
      label: Matching keys and aliases
      description: Include the exact configured matching terms, or say none.
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected candidate or none
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual candidates
    validations:
      required: true
  - type: input
    id: ruling_id
    attributes:
      label: Ruling ID
    validations:
      required: true
